name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # write: the format step below may commit layout fixes back to the branch.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Hand-edited article.json files are rewritten in the web editor's layout
      # and the fix is committed back, so a layout slip never blocks a deploy.
      # This run then carries on and deploys the formatted files; a push made
      # with GITHUB_TOKEN does not start another workflow run.
      - name: Format content
        run: |
          npm run format:content
          if git diff --quiet -- content/articles; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format article JSON in web editor layout" -- content/articles
          # If someone pushed meanwhile, their push starts a newer run that
          # cancels this one (concurrency above), so one rebase retry is enough.
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          }
      - name: Validate content
        run: npm run validate:content
      - name: Test scoring and migration
        run: npm test
      - name: Build
        run: npm run build
      # Requires Pages to be enabled with the "GitHub Actions" source. The
      # action's `enablement` option cannot do this for us — creating a Pages
      # site needs admin rights that GITHUB_TOKEN does not carry.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
